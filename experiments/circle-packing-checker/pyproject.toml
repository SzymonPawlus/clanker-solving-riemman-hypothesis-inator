[project]
name = "packcheck"
version = "0.1.0"
description = "Exact-arithmetic verifier for circle-packing-in-a-triangle certificates"
requires-python = ">=3.11,<3.14"
dependencies = [
    "sympy==1.13.3",
    "mpmath==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
