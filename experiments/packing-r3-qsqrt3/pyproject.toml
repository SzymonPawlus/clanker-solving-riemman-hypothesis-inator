[project]
name = "packing-r3-qsqrt3"
version = "0.1.0"
description = "Exact tight Q(sqrt 3) construction certificates for n = 17, 24, 31 circle packings in an equilateral triangle"
requires-python = ">=3.11"
dependencies = []

[tool.packing-r3-qsqrt3]
# mpmath is used ONLY by verify_closed_forms.py, to compare a float table
# against a closed form. Nothing load-bearing depends on it: the certificates
# are checked with stdlib fractions.Fraction alone.
optional-for-verify-closed-forms = ["mpmath>=1.3.0"]
