[project]
name = "cpbnb"
version = "0.1.0"
description = "Interval / exact-integer branch-and-bound lower bounds for circle packing in an equilateral triangle"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cpbnb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
